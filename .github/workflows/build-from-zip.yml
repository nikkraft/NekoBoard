name: Build from zip

# Репозиторий содержит только NekoBoard.zip и этот файл.
# Workflow сам распаковывает архив, собирает подписанный APK и (по желанию) выкладывает релиз.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза (например v1.0.0). Пусто — только собрать APK"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack NekoBoard.zip
        run: |
          unzip -q NekoBoard.zip
          ls NekoBoard
          chmod +x NekoBoard/gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android NDK
        run: sdkmanager "ndk;28.2.13676358"

      - name: Download rounded font (Nunito, OFL)
        working-directory: NekoBoard
        run: |
          mkdir -p app/src/main/assets/fonts
          curl -fsSL --retry 3 -o app/src/main/assets/fonts/rounded.ttf \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/nunito/Nunito%5Bwght%5D.ttf" \
            || { echo "::warning::Font download failed"; rm -f app/src/main/assets/fonts/rounded.ttf; }

      - name: Signing config (from secrets)
        working-directory: NekoBoard
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nekoboard.jks"
            {
              echo "RELEASE_STORE_FILE=$RUNNER_TEMP/nekoboard.jks"
              echo "RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
              echo "RELEASE_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            } >> local.properties
          else
            echo "::warning::Секреты подписи не заданы — APK будет подписан debug-ключом"
          fi

      - name: Build release APK
        working-directory: NekoBoard
        run: ./gradlew assembleRelease --stacktrace

      - name: Show signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for f in NekoBoard/app/build/outputs/apk/release/*.apk; do
            "$APKSIGNER" verify --print-certs "$f" | head -5
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NekoBoard-release-apk
          path: NekoBoard/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: ${{ inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp NekoBoard/app/build/outputs/apk/release/*.apk "NekoBoard-${{ inputs.tag }}.apk"
          gh release create "${{ inputs.tag }}" "NekoBoard-${{ inputs.tag }}.apk" \
            --repo "$GITHUB_REPOSITORY" --title "NekoBoard ${{ inputs.tag }}" --generate-notes
